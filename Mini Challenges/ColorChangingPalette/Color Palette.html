
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer Palette</title>
  <link rel="stylesheet" href="Color Palette.css">
</head>
<body>
    <div class="container">
        <h2>Click a box to change the background color!</h2>
        <div class="palette">
            <div class="color-box" id="red"></div>
            <div class="color-box" id="green"></div>
            <div class="color-box" id="blue"></div>
            <div class="color-box" id="black"></div>
        </div>
        <button id="reset-button">Reset</button>
    </div>
    <script src="Color Palette.js"></script> 
</body>
</html>
