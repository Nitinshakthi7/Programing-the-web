<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <div class="container">
        <h1>Live Character Counter</h1>
        <textarea id="messageInput" placeholder="Type your message here..." maxlength="1000"></textarea>
        <p class="counter-display">Characters: <span id="charCount">0</span>/1000</p>
        <button id="submitButton" disabled>Submit Message</button>
    </div>

    <script src="counter.js"></script>
</body>
</html>
